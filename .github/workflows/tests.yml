# Runs the test suite (tests/*.test.js, the same as tests/index.html in the
# browser) under Node on every push and pull request that touches code. The
# auto-analysis commits only change data/, so they don't start it.
# On branches other than main, render-diff also renders every Meta-Analyse tab
# with main's code and with the branch's and fails on any difference - the
# safety net for refactorings that must not change what the app shows.
name: Tests

on:
  push:
    paths: ['js/**', 'tests/**', 'scripts/**', '.github/workflows/tests.yml']
  pull_request:
    paths: ['js/**', 'tests/**', 'scripts/**', '.github/workflows/tests.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/run-node.mjs

  render-diff:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: main
          path: base
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Render main and this branch
        run: |
          node tests/render-snapshot.mjs base > base.json
          node tests/render-snapshot.mjs . > head.json
      - name: Compare
        run: |
          if diff base.json head.json > render.diff; then
            echo "Alle Tabs rendern identisch."
          else
            echo "::error::Das HTML der Tabs unterscheidet sich von main."
            head -n 60 render.diff
            exit 1
          fi
