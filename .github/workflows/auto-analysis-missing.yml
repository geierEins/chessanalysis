# Analyzes every game still missing from a player's master file (data/<user>.json),
# read from all of their archives: the "skipped" ones the other workflows gave
# up on (per-game timeout or an error), and any the scheduled run never saw -
# it only reads the newest months, so a game Chess.com adds to an older month
# later slips through. Started by hand (Actions -> "Run workflow"). No per-game
# timeout here. A skipped game that succeeds leaves the list; one that fails
# again (e.g. a game without moves) stays in it.
name: 'Auto-Analyse: Fehlende Partien'

on:
  workflow_dispatch:

# Shares the scheduled run's group: both write the same players' files, so they
# never run at once - a scheduled run waits until this one is done.
concurrency:
  group: auto-analysis
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    # GitHub's hard limit for a job is 6 hours - there is no "unlimited".
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Budget 320 min + the script's 15 min grace (analyze.mjs's GRACE_MS),
      # then the step limit - all below the job limit, so the commit still runs.
      - run: node scripts/auto-analysis/analyze.mjs
        timeout-minutes: 345
        env:
          MISSING: 1
          TIME_BUDGET_MINUTES: 320
      - if: ${{ !cancelled() }}
        run: "sh scripts/auto-analysis/commit-data.sh 'Auto-Analyse: fehlende Partien nachanalysiert'"
